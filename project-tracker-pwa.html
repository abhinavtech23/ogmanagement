<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14614E" />
  <meta name="description" content="Project tracker with budget and team collaboration" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Project Tracker" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%2314614E' width='180' height='180'/><text x='90' y='100' font-size='80' fill='white' text-anchor='middle' font-weight='bold'>P</text></svg>" />
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Project Tracker%22,%22short_name%22:%22Tracker%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%23E3E9E1%22,%22theme_color%22:%22%2314614E%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%27%2314614E%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%2796%27 fill=%27white%27 text-anchor=%27middle%27 font-weight=%27bold%27>P</text></svg>%22,%22sizes%22:%22192x192%22,%22type%22:%22image/svg+xml%22}]}" />
  <title>Project Tracker - Mobile App</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    :root {
      --sage: #E3E9E1;
      --paper: #FAFBF9;
      --ink: #16201A;
      --moss: #63756B;
      --line: #C8D2C6;
      --pine: #14614E;
      --brass: #A2740F;
      --madder: #8B2A34;
    }

    body {
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
      color: var(--ink);
      background: var(--sage);
      -webkit-font-smoothing: antialiased;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
    }

    .pt-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .pt-header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: max(12px, env(safe-area-inset-top)) 16px 12px;
      flex: none;
    }

    .pt-header__title {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 20px;
      font-weight: 600;
      margin: 0;
      color: var(--ink);
    }

    .pt-header__subtitle {
      font-size: 12px;
      color: var(--moss);
      margin: 4px 0 0;
    }

    .pt-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .pt-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      overflow-x: auto;
    }

    .pt-tab {
      background: none;
      border: 0;
      color: var(--moss);
      cursor: pointer;
      padding: 8px 12px;
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-weight: 600;
      font-size: 12px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color .15s;
    }

    .pt-tab:active { background: rgba(22,32,26,.05); }
    .pt-tab.is-active { color: var(--ink); border-bottom-color: var(--ink); }

    .pt-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .pt-card__name {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .pt-card__meta {
      font-size: 12px;
      color: var(--moss);
      margin: 0 0 10px;
    }

    .pt-fig {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(22,32,26,.07);
      font-size: 13px;
    }

    .pt-fig:last-child { border-bottom: none; }

    .pt-fig__label { color: var(--moss); font-size: 11px; font-weight: 600; }
    .pt-fig__value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

    .pt-btn {
      background: var(--paper);
      border: 1px solid var(--ink);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 3px;
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .pt-btn:active { background: rgba(22,32,26,.1); }
    .pt-btn--primary { background: var(--ink); color: var(--paper); }
    .pt-btn--small { padding: 8px 12px; font-size: 12px; }

    .pt-input, .pt-textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
      background: var(--paper);
      -webkit-appearance: none;
      appearance: none;
      margin-bottom: 8px;
    }

    .pt-textarea {
      resize: vertical;
      line-height: 1.5;
      min-height: 80px;
    }

    .pt-input::placeholder, .pt-textarea::placeholder { color: #9AA79C; }

    .pt-field { margin-bottom: 12px; }
    .pt-field__label {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--moss);
      margin-bottom: 4px;
      display: block;
    }

    .pt-footer {
      background: var(--paper);
      border-top: 1px solid var(--line);
      padding: 12px;
      display: flex;
      gap: 8px;
      flex: none;
      flex-wrap: wrap;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .pt-footer__btn { flex: 1; min-width: 100px; }

    .pt-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--moss);
    }

    .pt-empty h2 {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-size: 18px;
      margin: 0 0 8px;
      color: var(--ink);
    }

    .pt-empty p { margin: 0 0 16px; font-size: 13px; }

    .pt-file-input {
      position: relative;
      display: inline-block;
    }

    .pt-file-input input[type="file"] { display: none; }

    .pt-link {
      background: none;
      border: 0;
      color: var(--moss);
      cursor: pointer;
      font-size: 12px;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .pt-link:active { color: var(--ink); }

    .pt-tabpane { display: none; }
    .pt-tabpane.is-active { display: block; }

    .pt-remark {
      background: rgba(22,32,26,.04);
      border-radius: 3px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .pt-remark__author {
      font-weight: 600;
      color: var(--ink);
      font-size: 11px;
    }

    .pt-remark__time {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      color: var(--moss);
    }

    .pt-remark__text {
      margin: 4px 0 0;
      color: var(--ink);
      line-height: 1.4;
      word-wrap: break-word;
    }

    .pt-remark__img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 3px;
      margin-top: 6px;
      cursor: pointer;
      display: block;
    }

    .pt-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .pt-modal.is-open { display: flex; }

    .pt-modal__content {
      background: var(--paper);
      border-radius: 4px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
    }

    .pt-modal__img {
      width: 100%;
      border-radius: 3px;
      margin: 0;
    }

    @supports (padding: max(0px)) {
      body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
    }

    @media (max-width: 600px) {
      .pt-card { margin-bottom: 8px; padding: 12px; }
      .pt-card__name { font-size: 14px; margin: 0 0 6px; }
      .pt-input, .pt-textarea { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="pt-root">
    <div class="pt-header">
      <h1 class="pt-header__title">📊 Project Tracker</h1>
      <div class="pt-header__subtitle" id="headerSubtitle">Load projects...</div>
    </div>

    <div class="pt-content" id="content"></div>

    <div class="pt-footer">
      <button class="pt-btn pt-btn--primary pt-footer__btn" onclick="app.openCreateModal()">+ New</button>
      <button class="pt-btn pt-footer__btn" onclick="app.toggleSettings()">⚙️</button>
    </div>
  </div>

  <!-- Photo Modal -->
  <div class="pt-modal" id="photoModal" onclick="if (event.target === this) this.classList.remove('is-open')">
    <div class="pt-modal__content" onclick="event.stopPropagation()">
      <img id="photoDisplay" class="pt-modal__img" />
    </div>
  </div>

  <script>
    const CURRENCIES = {
      INR: { symbol: "₹", locale: "en-IN" },
      USD: { symbol: "$", locale: "en-US" },
      EUR: { symbol: "€", locale: "de-DE" },
    };

    class ProjectTracker {
      constructor() {
        this.projects = [];
        this.staff = [];
        this.currency = "INR";
        this.botToken = "";
        this.yourTgId = "";
        this.load();
        this.render();
      }

      load() {
        const data = localStorage.getItem("pt-data");
        if (data) {
          try {
            const parsed = JSON.parse(data);
            this.projects = parsed.projects || [];
            this.currency = parsed.currency || "INR";
            this.staff = parsed.staff || [];
            this.botToken = parsed.botToken || "";
            this.yourTgId = parsed.yourTgId || "";
          } catch (e) {
            console.error("Load error", e);
          }
        }
      }

      save() {
        localStorage.setItem("pt-data", JSON.stringify({
          projects: this.projects,
          currency: this.currency,
          staff: this.staff,
          botToken: this.botToken,
          yourTgId: this.yourTgId,
        }));
      }

      uid() {
        return Math.random().toString(36).slice(2, 10);
      }

      formatMoney(amount) {
        const cur = CURRENCIES[this.currency];
        return cur.symbol + new Intl.NumberFormat(cur.locale, { maximumFractionDigits: 0 }).format(Math.round(Number(amount) || 0));
      }

      formatDate(iso) {
        if (!iso) return null;
        const d = new Date(iso);
        const cur = CURRENCIES[this.currency];
        return d.toLocaleDateString(cur.locale, { day: "numeric", month: "short" });
      }

      formatTime(date) {
        return date.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
      }

      getSpent(p) {
        return (p.expenses || []).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      }

      render() {
        const total = this.projects.reduce((s, p) => s + (Number(p.price) || 0), 0);
        const spent = this.projects.reduce((s, p) => s + this.getSpent(p), 0);

        document.getElementById("headerSubtitle").textContent = `${this.formatMoney(spent)} / ${this.formatMoney(total)} • ${this.projects.length} projects`;

        const html = this.projects.length === 0
          ? `<div class="pt-empty"><h2>No projects</h2><p>Tap "+ New" to create one</p></div>`
          : this.projects.map((p) => this.renderCard(p)).join("");

        document.getElementById("content").innerHTML = html;
        this.attachHandlers();
      }

      renderCard(p) {
        const spent = this.getSpent(p);
        const price = Number(p.price) || 0;
        const remaining = price - spent;
        const pct = price > 0 ? (spent / price) * 100 : 0;

        return `
          <div class="pt-card">
            <h3 class="pt-card__name">${this.escapeHtml(p.name)}</h3>
            <div class="pt-card__meta">${this.escapeHtml(p.client || "No client")} • ${this.formatDate(p.due) || "No date"}</div>

            <div class="pt-fig">
              <span class="pt-fig__label">Budget</span>
              <span class="pt-fig__value">${this.formatMoney(price)}</span>
            </div>
            <div class="pt-fig">
              <span class="pt-fig__label">Spent</span>
              <span class="pt-fig__value">${this.formatMoney(spent)}</span>
            </div>
            <div class="pt-fig">
              <span class="pt-fig__label">${remaining < 0 ? "Over" : "Left"}</span>
              <span class="pt-fig__value">${this.formatMoney(Math.abs(remaining))}</span>
            </div>
            <div class="pt-fig">
              <span class="pt-fig__label">Used</span>
              <span class="pt-fig__value">${Math.round(pct)}%</span>
            </div>

            <div style="display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;">
              <button class="pt-btn pt-btn--small" onclick="app.toggleProject('${p.id}')">Details</button>
              <button class="pt-btn pt-btn--small" onclick="app.openEditModal('${p.id}')">Edit</button>
              <button class="pt-btn pt-btn--small" onclick="app.deleteProject('${p.id}')">Delete</button>
            </div>

            <div id="detail-${p.id}" style="display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);">
              <div class="pt-tabs">
                <button class="pt-tab is-active" data-tab="budget" onclick="app.switchTab('${p.id}', 'budget')">💰 Budget</button>
                <button class="pt-tab" data-tab="updates" onclick="app.switchTab('${p.id}', 'updates')">📋 Updates</button>
              </div>

              <div id="tab-${p.id}-budget" class="pt-tabpane is-active">
                ${this.renderBudgetTab(p)}
              </div>

              <div id="tab-${p.id}-updates" class="pt-tabpane">
                ${this.renderUpdatesTab(p)}
              </div>
            </div>
          </div>
        `;
      }

      renderBudgetTab(p) {
        const expenses = (p.expenses || []).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        return `
          ${expenses.length > 0 ? `
            <div style="margin-bottom: 12px;">
              ${expenses.slice(0, 5).map((e) => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(22,32,26,.07); font-size: 12px;">
                  <div>
                    <div style="font-weight: 500; color: var(--ink);">${this.escapeHtml(e.label)}</div>
                    <div style="font-size: 10px; color: var(--moss);">${this.formatDate(e.date) || "—"}</div>
                  </div>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600;">${this.formatMoney(e.amount)}</span>
                    <button class="pt-link" onclick="app.removeExpense('${p.id}', '${e.id}')">✕</button>
                  </div>
                </div>
              `).join("")}
            </div>
          ` : ""}

          <div class="pt-field">
            <label class="pt-field__label">Description</label>
            <input type="text" class="pt-input" placeholder="What for?" data-exp-label="${p.id}" style="margin-bottom: 6px;" />
          </div>
          <div style="display: flex; gap: 6px;">
            <input type="number" class="pt-input" placeholder="Amount" data-exp-amount="${p.id}" style="flex: 1;" />
            <input type="date" class="pt-input" data-exp-date="${p.id}" style="flex: 1;" />
          </div>
          <button class="pt-btn pt-btn--primary" onclick="app.addExpense('${p.id}')" style="width: 100%; margin-top: 6px;">Log Cost</button>
        `;
      }

      renderUpdatesTab(p) {
        return `
          ${(p.remarks || []).length > 0 ? `
            <div style="margin-bottom: 12px;">
              ${(p.remarks || []).reverse().slice(0, 5).map((r) => `
                <div class="pt-remark">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <span class="pt-remark__author">👤 ${this.escapeHtml(r.by)}</span>
                    <span class="pt-remark__time">${r.time}</span>
                  </div>
                  <p class="pt-remark__text">${this.escapeHtml(r.text)}</p>
                  ${r.photo ? `<img class="pt-remark__img" src="${r.photo}" onclick="app.viewPhoto(this.src)" />` : ""}
                  <button class="pt-link" onclick="app.removeRemark('${p.id}', '${r.id}')" style="margin-top: 4px;">Delete</button>
                </div>
              `).join("")}
            </div>
          ` : ""}

          <div class="pt-field">
            <label class="pt-field__label">Who</label>
            <select class="pt-input" data-rem-staff="${p.id}" style="margin-bottom: 6px;">
              <option>You</option>
              ${(this.staff || []).map((s) => `<option>${this.escapeHtml(s.name)}</option>`).join("")}
            </select>
          </div>

          <div class="pt-field">
            <label class="pt-field__label">Update</label>
            <textarea class="pt-input" placeholder="What's new?" data-rem-text="${p.id}" style="margin-bottom: 6px;"></textarea>
          </div>

          <div style="display: flex; gap: 6px;">
            <label class="pt-file-input pt-btn" style="flex: 1; text-align: center; margin-bottom: 6px;">
              📷 Photo
              <input type="file" accept="image/*" data-rem-photo="${p.id}" onchange="app.handlePhoto(event)" />
            </label>
            <button class="pt-btn pt-btn--primary" onclick="app.addRemark('${p.id}')" style="flex: 1;">Post</button>
          </div>
        `;
      }

      attachHandlers() {
        // Tab switching
        document.querySelectorAll(".pt-tab").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const projectId = btn.parentElement.parentElement.parentElement.querySelector(".pt-card__name").textContent;
            const tabName = btn.dataset.tab;
            // Tab switching is done via onclick
          });
        });
      }

      switchTab(projectId, tabName) {
        const tabs = document.querySelectorAll(`#detail-${projectId} .pt-tab`);
        const panes = document.querySelectorAll(`#detail-${projectId} .pt-tabpane`);

        tabs.forEach(t => t.classList.remove("is-active"));
        panes.forEach(p => p.classList.remove("is-active"));

        document.querySelector(`#detail-${projectId} [data-tab="${tabName}"]`)?.classList.add("is-active");
        document.getElementById(`tab-${projectId}-${tabName}`)?.classList.add("is-active");
      }

      toggleProject(projectId) {
        const detail = document.getElementById(`detail-${projectId}`);
        detail.style.display = detail.style.display === "none" ? "block" : "none";
      }

      escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      handlePhoto(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          event.target.dataset.photoData = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      addExpense(projectId) {
        const p = this.projects.find((x) => x.id === projectId);
        const label = document.querySelector(`[data-exp-label="${projectId}"]`).value.trim();
        const amount = document.querySelector(`[data-exp-amount="${projectId}"]`).value;
        const date = document.querySelector(`[data-exp-date="${projectId}"]`).value;

        if (!label || !amount) return;
        if (!p.expenses) p.expenses = [];

        p.expenses.push({
          id: this.uid(),
          label,
          amount: Number(amount),
          date: date || "",
        });

        this.save();
        this.render();
      }

      removeExpense(projectId, expenseId) {
        const p = this.projects.find((x) => x.id === projectId);
        if (p) {
          p.expenses = (p.expenses || []).filter((e) => e.id !== expenseId);
          this.save();
          this.render();
        }
      }

      addRemark(projectId) {
        const p = this.projects.find((x) => x.id === projectId);
        const text = document.querySelector(`[data-rem-text="${projectId}"]`).value.trim();
        const staff = document.querySelector(`[data-rem-staff="${projectId}"]`).value;
        const photoInput = document.querySelector(`[data-rem-photo="${projectId}"]`);

        if (!text && !photoInput.dataset.photoData) return;
        if (!p.remarks) p.remarks = [];

        const now = new Date();
        p.remarks.push({
          id: this.uid(),
          by: staff,
          text,
          time: this.formatTime(now),
          date: now.toISOString(),
          photo: photoInput.dataset.photoData || null,
        });

        // Send Telegram
        if (this.botToken && this.yourTgId) {
          fetch(`https://api.telegram.org/bot${this.botToken}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: this.yourTgId,
              text: `📋 *${p.name}*\n👤 ${staff}\n${text}`,
              parse_mode: "Markdown",
            }),
          }).catch(() => {});
        }

        this.save();
        this.render();
      }

      removeRemark(projectId, remarkId) {
        const p = this.projects.find((x) => x.id === projectId);
        if (p) {
          p.remarks = (p.remarks || []).filter((r) => r.id !== remarkId);
          this.save();
          this.render();
        }
      }

      viewPhoto(src) {
        document.getElementById("photoDisplay").src = src;
        document.getElementById("photoModal").classList.add("is-open");
      }

      openCreateModal() {
        const name = prompt("Project name:");
        if (!name) return;
        const client = prompt("Client (optional):");
        const price = prompt("Budget:");

        this.projects.unshift({
          id: this.uid(),
          name,
          client: client || "",
          price: Number(price) || 0,
          start: "",
          due: "",
          notes: "",
          status: "running",
          expenses: [],
          remarks: [],
          staff: [],
        });

        this.save();
        this.render();
      }

      openEditModal(projectId) {
        const p = this.projects.find((x) => x.id === projectId);
        const name = prompt("Project name:", p.name);
        if (!name) return;
        p.name = name;
        p.client = prompt("Client:", p.client) || "";
        p.price = Number(prompt("Budget:", p.price)) || 0;
        this.save();
        this.render();
      }

      deleteProject(projectId) {
        if (confirm("Delete this project?")) {
          this.projects = this.projects.filter((p) => p.id !== projectId);
          this.save();
          this.render();
        }
      }

      toggleSettings() {
        const token = prompt("Bot Token (leave blank to skip):", this.botToken);
        if (token !== null) {
          this.botToken = token;
          const id = prompt("Your Telegram ID (leave blank to skip):", this.yourTgId);
          if (id !== null) {
            this.yourTgId = id;
            this.save();
            alert("Saved!");
          }
        }
      }
    }

    let app;
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => {
        app = new ProjectTracker();
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("data:application/javascript,self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));").catch(() => {});
        }
      });
    } else {
      app = new ProjectTracker();
    }
  </script>
</body>
</html>
